<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex,nofollow">
  <title>Lighthouse diagnostic export</title>
</head>
<body>
  <form name="lh-diagnostic-export" method="POST" data-netlify="true" data-netlify-honeypot="bot-field">
    <input type="hidden" name="form-name" value="lh-diagnostic-export">
    <p style="display:none"><label>Do not fill: <input name="bot-field"></label></p>
    <label>Source <input name="source"></label>
    <label>Payload <textarea name="payload"></textarea></label>
  </form>
</body>
</html>
